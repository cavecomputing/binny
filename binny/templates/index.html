{% extends 'base.html' %}
{% block head %}
    {# Hidden sidebar, remembered per device: set before the first paint so it doesn't flash open. #}
    <script>try { if (localStorage.getItem('binny-sidebar') === 'hidden') document.documentElement.classList.add('side-hidden'); } catch (e) {}</script>
    <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
{% endblock %}
{% block body %}
<div class="cc-shell app" id="shell">
    <header class="topbar">
        <button class="icon-btn" id="sideBtn" type="button" title="Sidebar ( [ )" aria-label="Show or hide the sidebar"><svg class="i"><use href="#i-panel"/></svg></button>
        <span class="brand"><svg class="logo"><use href="#i-folder"/></svg><span class="cc-wordmark">binny</span></span>
        <div class="grow"></div>
        <button class="cc-btn cc-btn--primary plus" id="uploadBtn" type="button" title="Upload files (U)" aria-label="Upload files"><svg class="i"><use href="#i-plus"/></svg></button>
        <button class="icon-btn" id="themeBtn" type="button" title="Switch theme" aria-label="Switch theme"><svg class="i"><use href="#i-sun"/></svg></button>
        <form method="post" action="{{ url_for('auth.logout') }}">
            <button class="icon-btn" type="submit" title="Sign out" aria-label="Sign out"><svg class="i"><use href="#i-logout"/></svg></button>
        </form>
    </header>

    <div class="body">
        <aside class="cc-shell__side side" id="side">
            <section>
                <div class="cc-eyebrow">Folders</div>
                <nav class="nav" id="tree" aria-label="Folders"></nav>
            </section>
            <nav class="nav" aria-label="Trash">
                <a class="cc-shell__row" id="trashNav" href="#trash" data-trash><svg class="i"><use href="#i-trash"/></svg><span>Trash</span><span class="count" id="trashCount"></span></a>
            </nav>
            <div class="grow"></div>
            <div class="storage" id="storage"></div>
        </aside>

        <main class="cc-shell__main" id="main">
            <section class="view" id="filesView">
                <div class="subbar">
                    <nav class="crumbs" id="crumbs" aria-label="Folder path"></nav>
                    <div class="summary" id="summary"></div>
                    <div class="grow"></div>
                    <button class="cc-btn cc-btn--ghost cc-btn--sm" id="newFolderBtn" type="button" title="New folder (N)"><svg class="i"><use href="#i-folder-plus"/></svg><span>New folder</span></button>
                </div>
                <div class="selbar" id="selbar" hidden>
                    <b id="selCount"></b>
                    <div class="grow"></div>
                    <button class="cc-btn cc-btn--ghost cc-btn--sm" id="selRename" type="button"><svg class="i"><use href="#i-rename"/></svg><span>Rename</span></button>
                    <button class="cc-btn cc-btn--ghost cc-btn--sm" id="selMove" type="button"><svg class="i"><use href="#i-move"/></svg><span>Move to…</span></button>
                    <button class="cc-btn cc-btn--ghost cc-btn--sm" id="selDownload" type="button"><svg class="i"><use href="#i-download"/></svg><span id="selDownloadLabel">Download</span></button>
                    <button class="cc-btn cc-btn--danger cc-btn--sm" id="selTrash" type="button" title="Move to trash (Del)"><svg class="i"><use href="#i-trash"/></svg><span>Trash</span></button>
                    <button class="cc-btn cc-btn--sm" id="selClear" type="button"><span>Clear</span></button>
                </div>
                <div class="list" id="list"></div>
            </section>

            <section class="view" id="trashView" hidden>
                <div class="subbar">
                    <div class="crumbs"><b>trash</b></div>
                    <div class="summary" id="trashSummary"></div>
                    <div class="grow"></div>
                    <button class="cc-btn cc-btn--danger cc-btn--sm" id="emptyTrashBtn" type="button"><svg class="i"><use href="#i-trash"/></svg><span>Empty trash</span></button>
                </div>
                <div class="selbar" id="trashSelbar" hidden>
                    <b id="trashSelCount"></b>
                    <div class="grow"></div>
                    <button class="cc-btn cc-btn--ghost cc-btn--sm" id="trashSelRestore" type="button"><svg class="i"><use href="#i-restore"/></svg><span>Restore</span></button>
                    <button class="cc-btn cc-btn--danger cc-btn--sm" id="trashSelDelete" type="button"><svg class="i"><use href="#i-trash"/></svg><span>Delete forever</span></button>
                    <button class="cc-btn cc-btn--sm" id="trashSelClear" type="button"><span>Clear</span></button>
                </div>
                <div class="list" id="trashList"></div>
            </section>
        </main>
    </div>

    <div class="scrim" id="scrim" hidden></div>
    <div class="drop-hint" id="dropHint" hidden><svg class="i"><use href="#i-upload"/></svg><span id="dropHintText"></span></div>

    <section class="cc-settings-card uploads" id="uploads" hidden aria-live="polite">
        <div class="uploads__top">
            <svg class="i"><use href="#i-upload"/></svg>
            <b id="uploadTitle"></b>
            <span class="num" id="uploadPercent"></span>
            <button class="icon-btn" id="uploadClose" type="button" title="Cancel" aria-label="Cancel uploads"><svg class="i"><use href="#i-x"/></svg></button>
        </div>
        <div class="bar"><i id="uploadBar"></i></div>
        <div class="path" id="uploadNow"></div>
        <ul class="uploads__errors" id="uploadErrors"></ul>
    </section>
</div>

<input type="file" id="filePicker" multiple hidden>

<div class="toast" id="toast" role="status" popover="manual"></div>

<dialog class="cc-settings-card dialog" id="askDialog" aria-labelledby="askTitle">
    <form>
        <header class="cc-card-header"><svg><use id="askIcon" href="#i-rename"/></svg><h4 id="askTitle"></h4></header>
        <p id="askText"></p>
        <input class="cc-input" id="askInput" autocomplete="off" spellcheck="false" aria-labelledby="askTitle">
        <div class="row-btns">
            <button class="cc-btn cc-btn--ghost" type="button" data-close><span>Cancel</span></button>
            <button class="cc-btn cc-btn--primary" id="askOk" type="submit"><span>OK</span></button>
        </div>
    </form>
</dialog>

<dialog class="cc-settings-card dialog" id="moveDialog" aria-labelledby="moveTitle">
    <form>
        <header class="cc-card-header"><svg><use href="#i-move"/></svg><h4 id="moveTitle"></h4></header>
        <nav class="crumbs" id="moveCrumbs" aria-label="Destination path"></nav>
        <div class="picker" id="movePicker"></div>
        <div class="row-btns">
            <button class="cc-btn cc-btn--ghost" type="button" data-close><span>Cancel</span></button>
            <button class="cc-btn cc-btn--primary" id="moveHere" type="submit"><span>Move here</span></button>
        </div>
    </form>
</dialog>
{% endblock %}
