{% extends 'base.html' %}
{% block title %}Sign in · Binny{% endblock %}
{% block body %}
<main class="signin">
    <form method="post">
        <div class="signin__brand">
            <span class="logo"><svg><use href="#i-folder"/></svg></span>
            <h1 class="wordmark">binny</h1>
            <p>Enter the password to open your files.</p>
        </div>
        <div class="card">
            {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
            <div class="field">
                <label for="password">Password</label>
                <input class="input" id="password" name="password" type="password" autocomplete="current-password" required autofocus>
            </div>
            <label class="check"><input type="checkbox" name="remember" checked> Keep this device signed in</label>
            <button class="btn btn--primary btn--block" type="submit"><span>Sign in</span></button>
        </div>
    </form>
</main>
{% endblock %}
