# Cuts a release when VERSION changes on main: tags the commit vX.Y.Z (unless that tag exists
# already) and runs release.yml for it. So a release is: set VERSION, push to main. Nothing else
# changes VERSION, so a release happens only when someone sets it. release.yml is called directly
# because a tag pushed with the workflow's own token starts no other workflow.
name: Tag

on:
  push:
    branches: [main]
    paths: [VERSION]

concurrency: tag # two pushes close together tag one at a time

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushing the tag
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Tag the version if it is new
        id: tag
        run: |
          tag="v$(tr -d '[:space:]' < VERSION)"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag exists already, nothing to release"
          else
            git tag "$tag"
            git push origin "$tag"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: tag
    if: needs.tag.outputs.tag != ''
    permissions:
      contents: write # creating the release and uploading the builds
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
